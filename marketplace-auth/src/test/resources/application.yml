spring:
  datasource:
    url: jdbc:mysql://localhost:3306/marketplace_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  flyway:
    enabled: false
  
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

  test:
    database:
      replace: none

app:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256
    access-token-expiry-minutes: 60
    refresh-token-expiry-days: 30
    issuer: test-issuer
    audience: test-audience

logging:
  level:
    com.marketplace.auth: DEBUG
    org.springframework.security: DEBUG