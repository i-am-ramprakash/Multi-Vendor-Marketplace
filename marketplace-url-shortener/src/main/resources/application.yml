server:
  port: 8089
  servlet:
    context-path: /api

spring:
  application:
    name: marketplace-url-shortener
  
  datasource:
    url: jdbc:mysql://localhost:3306/multivendor_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000

app:
  version: 1.0.0
  description: Multi-Vendor Marketplace URL Shortener API
  url:
    shortener:
      base-url: ${URL_SHORTENER_BASE_URL:http://localhost:8088/s}
      cache:
        ttl-seconds: 3600
      rate-limit:
        create-url-max: 10
        create-url-window-minutes: 60

logging:
  level:
    com.marketplace.urlshortener: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html