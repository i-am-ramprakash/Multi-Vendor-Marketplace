services:
  # Infrastructure
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-multivendor_marketplace}
      MYSQL_USER: ${DB_USERNAME:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: marketplace-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: marketplace-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  # Frontend
  marketplace-frontend:
    build: ./marketplace-frontend
    container_name: marketplace-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://gateway:8080}
    depends_on:
      - marketplace-gateway
    networks:
      - marketplace-network

  # API Gateway
  marketplace-gateway:
    build: ./marketplace-gateway
    container_name: marketplace-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - marketplace-auth
      - marketplace-vendor
      - marketplace-product
      - marketplace-cart
      - marketplace-wishlist
      - marketplace-order
      - marketplace-commission
      - marketplace-notification
      - marketplace-url-shortener
      - marketplace-cache
      - marketplace-admin
    environment:
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-hs256}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://marketplace-auth:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://marketplace-vendor:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://marketplace-product:8083
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://marketplace-cart:8084
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://marketplace-wishlist:8085
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://marketplace-order:8086
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://marketplace-commission:8087
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: http://marketplace-notification:8088
      SPRING_CLOUD_GATEWAY_ROUTES_8_URI: http://marketplace-url-shortener:8089
      SPRING_CLOUD_GATEWAY_ROUTES_9_URI: http://marketplace-cache:8090
      SPRING_CLOUD_GATEWAY_ROUTES_10_URI: http://marketplace-admin:8091
    networks:
      - marketplace-network

  # Microservices
  marketplace-auth:
    build: ./marketplace-auth
    container_name: marketplace-auth
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-hs256}
    networks:
      - marketplace-network

  marketplace-vendor:
    build: ./marketplace-vendor
    container_name: marketplace-vendor
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-product:
    build: ./marketplace-product
    container_name: marketplace-product
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-cart:
    build: ./marketplace-cart
    container_name: marketplace-cart
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-wishlist:
    build: ./marketplace-wishlist
    container_name: marketplace-wishlist
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-order:
    build: ./marketplace-order
    container_name: marketplace-order
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-commission:
    build: ./marketplace-commission
    container_name: marketplace-commission
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

  marketplace-notification:
    build: ./marketplace-notification
    container_name: marketplace-notification
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - marketplace-network

  marketplace-url-shortener:
    build: ./marketplace-url-shortener
    container_name: marketplace-url-shortener
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - marketplace-network

  marketplace-cache:
    build: ./marketplace-cache
    container_name: marketplace-cache
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - marketplace-network

  marketplace-admin:
    build: ./marketplace-admin
    container_name: marketplace-admin
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-multivendor_marketplace}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-marketplace}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-marketplace}
    networks:
      - marketplace-network

volumes:
  mysql-data:
  redis-data:

networks:
  marketplace-network:
    driver: bridge
